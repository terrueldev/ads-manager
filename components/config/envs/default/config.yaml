# yaml-language-server: $schema=../../schemas/config.schema.json
# Base configuration - other environments inherit from this

global: {}  # Reserved for future cross-cutting concerns

# Component sections - users add properties as needed
# Section names match component directory names exactly

ads-manager-db:
  host: localhost
  port: 5432
  name: ads_manager
  user: app
  passwordSecret: db-credentials
  pool: 10

ads-manager-server:
  port: 3000
  probesPort: 9090
  logLevel: info
  database:
    host: localhost
    port: 5432
    name: ads_manager
    user: app
    passwordSecret: db-credentials # k8s Secret name; the actual value is injected via DB_PASSWORD env var at runtime, never stored here
    pool: 10
  # --- Google Ads Connection prerequisites (see changes/.../google-ads-connection/SPEC.md > Dependencies) ---
  # None of these have real values here on purpose. They must be provided via environment
  # variables (e.g. a local .env file loaded by dotenv in src/config/load_config.ts, which is the
  # ONLY place allowed to read process.env — see backend-standards). Until a Google Cloud project,
  # OAuth client, and Google Ads developer token exist (pending manual setup), these stay empty and
  # any attempt to actually run the OAuth/Google Ads flow will fail with a clear error from Google's
  # SDKs — that is expected until the manual prerequisite is complete.
  googleOAuth:
    clientId: "" # GOOGLE_OAUTH_CLIENT_ID
    clientSecret: "" # GOOGLE_OAUTH_CLIENT_SECRET — never commit a real value
    # Points at the WEBAPP's callback route, not the server's. Google performs a full browser
    # navigation to this URI; GET /oauth/google-ads/callback itself (server) only ever returns JSON
    # and is still called — but via a same-origin fetch from the webapp route below, not by Google
    # directly. See components/webapps/ads-manager-webapp/src/pages/contas_callback_page/contas_callback_page.tsx
    # for the full design-decision writeup. GOOGLE_OAUTH_REDIRECT_URI overrides this for other envs.
    redirectUri: "http://localhost:5173/contas/callback"
  googleAds:
    developerToken: "" # GOOGLE_ADS_DEVELOPER_TOKEN — never commit a real value
  # tokenEncryptionKey has no key here at all (not even an empty placeholder key name) — it is
  # ALWAYS sourced from the TOKEN_ENCRYPTION_KEY env var (32 random bytes, base64-encoded) and is
  # never written to any config.yaml, committed or not.

ads-manager-webapp:
  apis:
    ads-manager-api:
      base_url: http://localhost:3000
