# yaml-language-server: $schema=../../schemas/config.schema.json
# Base configuration - other environments inherit from this

global: {}  # Reserved for future cross-cutting concerns

# Component sections - users add properties as needed
# Section names match component directory names exactly

ads-manager-db:
  host: localhost
  port: 5432
  name: ads_manager
  user: app
  passwordSecret: db-credentials
  pool: 10

ads-manager-server:
  port: 3000
  probesPort: 9090
  logLevel: info
  databases:
    ads-manager-db:
      host: localhost
      port: 5432
      name: ads_manager
      ssl: false

ads-manager-webapp:
  apis:
    ads-manager-api:
      base_url: http://localhost:3000
