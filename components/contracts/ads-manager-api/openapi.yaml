openapi: 3.0.3
info:
  title: ads-manager API
  version: 1.0.0
  description: >
    API specification for ads-manager. Covers the Google Ads Connection
    change (OAuth connection flow and CRUD over connected Google Ads
    accounts) and the Campaign Performance Dashboard change (cached
    campaign metrics per account/date range). Single-user application —
    no authentication layer.

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: OAuth
    description: Google OAuth connection flow for Google Ads accounts.
  - name: Accounts
    description: Connected Google Ads accounts.
  - name: Campaigns
    description: Campaign performance metrics for a connected account.

paths:
  # NOTE: Health check endpoints (/health, /readiness, /liveness) are NOT defined here.
  # They are infrastructure endpoints implemented directly in the controller.

  /oauth/google-ads/start:
    get:
      operationId: startGoogleAdsOAuth
      summary: Start the Google Ads OAuth connection flow
      description: >
        Generates and stores a CSRF-protection `state` value and returns the
        Google OAuth consent screen URL the frontend should redirect the user
        to.
      tags:
        - OAuth
      responses:
        '200':
          description: Authorization URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartOAuthResponse'

  /oauth/google-ads/callback:
    get:
      operationId: handleGoogleAdsOAuthCallback
      summary: Handle the Google OAuth callback
      description: >
        Called by Google after the user completes (or denies) consent.
        Validates the `state` parameter, exchanges the authorization `code`
        for tokens, and lists the Google Ads accounts accessible to that
        identity (including sub-accounts of an MCC), flagging accounts that
        are already connected. Tokens are only persisted once the user
        confirms a selection via `POST /accounts`.
      tags:
        - OAuth
      parameters:
        - name: code
          in: query
          description: Authorization code issued by Google.
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: CSRF-protection value echoed back by Google.
          required: false
          schema:
            type: string
        - name: error
          in: query
          description: Error code returned by Google when the user denies consent.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Accessible Google Ads accounts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCallbackResponse'
        '400':
          description: Invalid OAuth state or consent denied by the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidState:
                  summary: Missing or invalid state parameter
                  value:
                    error:
                      code: INVALID_STATE
                      message: state do OAuth ausente ou inválido
                oauthDenied:
                  summary: User denied OAuth consent
                  value:
                    error:
                      code: OAUTH_DENIED
                      message: Usuário negou o consentimento OAuth
        '502':
          description: Failed to query accessible accounts from the Google Ads API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                googleAdsApiError:
                  summary: Google Ads API error while listing accessible accounts
                  value:
                    error:
                      code: GOOGLE_ADS_API_ERROR
                      message: Falha ao consultar contas acessíveis na Google Ads API

  /accounts:
    get:
      operationId: listAccounts
      summary: List connected Google Ads accounts
      description: >
        Returns all currently connected Google Ads accounts with their basic
        metadata and connection status.
      tags:
        - Accounts
      responses:
        '200':
          description: Connected accounts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponse'
    post:
      operationId: connectAccounts
      summary: Persist the selected Google Ads accounts
      description: >
        Persists the accounts selected by the user after the OAuth callback,
        storing the encrypted refresh token and account metadata for each.
      tags:
        - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAccountsRequest'
      responses:
        '201':
          description: Accounts connected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectAccountsResponse'
        '409':
          description: One of the requested accounts is already connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyConnected:
                  summary: Account already connected
                  value:
                    error:
                      code: ALREADY_CONNECTED
                      message: Esta conta já está conectada

  /accounts/{id}:
    delete:
      operationId: disconnectAccount
      summary: Disconnect a connected Google Ads account
      description: >
        Removes the account, its OAuth tokens, and associated data. No
        further calls are made to this account after disconnection.
      tags:
        - Accounts
      parameters:
        - name: id
          in: path
          description: Internal id of the connected account.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Account disconnected successfully
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountNotFound:
                  summary: Account not found
                  value:
                    error:
                      code: ACCOUNT_NOT_FOUND
                      message: Conta não encontrada

  /accounts/{id}/campaigns:
    get:
      operationId: listCampaigns
      summary: List a connected account's campaigns with performance metrics
      description: >
        Returns the campaigns for a connected Google Ads account over the
        requested date range, with key performance metrics computed from raw
        values (impressions, clicks, cost, conversions, conversion value).
        Results are served from a 15-minute cache unless `refresh=true` is
        passed. If the Google Ads API fails but a cache entry exists for this
        account + date range (even expired), the cached data is returned with
        `stale: true`.
      tags:
        - Campaigns
      parameters:
        - name: id
          in: path
          description: Internal id of the connected account.
          required: true
          schema:
            type: string
            format: uuid
        - name: range
          in: query
          description: >
            Date range preset. `custom` requires `start` and `end` to also be
            provided.
          required: false
          schema:
            $ref: '#/components/schemas/CampaignDateRange'
        - name: start
          in: query
          description: >
            Start date (inclusive), required when `range=custom`. Ignored
            otherwise.
          required: false
          schema:
            type: string
            format: date
        - name: end
          in: query
          description: >
            End date (inclusive), required when `range=custom`. Ignored
            otherwise.
          required: false
          schema:
            type: string
            format: date
        - name: refresh
          in: query
          description: When true, bypasses the cache and forces a fresh fetch.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Campaigns retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCampaignsResponse'
        '400':
          description: Invalid or missing date range parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidDateRange:
                  summary: start is after end, or custom range missing start/end
                  value:
                    error:
                      code: INVALID_DATE_RANGE
                      message: Data final deve ser depois da data inicial
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountNotFound:
                  summary: Account not found
                  value:
                    error:
                      code: ACCOUNT_NOT_FOUND
                      message: Conta não encontrada
        '409':
          description: Account needs to be reconnected before its data can be viewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountNeedsReconnect:
                  summary: Account status is needs_reconnect
                  value:
                    error:
                      code: ACCOUNT_NEEDS_RECONNECT
                      message: Esta conta precisa ser reconectada antes de ver os dados
        '502':
          description: Failed to fetch campaign data and no cache available to fall back to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                googleAdsApiError:
                  summary: Google Ads API error and no cache available
                  value:
                    error:
                      code: GOOGLE_ADS_API_ERROR
                      message: Não foi possível carregar os dados desta conta agora. Tente novamente.

components:
  schemas:
    AccountStatus:
      type: string
      description: >
        Lifecycle status of a connected account. `active` is usable,
        `suspended` reflects a suspension on the Google Ads side, and
        `needs_reconnect` means the refresh token failed and the OAuth flow
        must be re-run for this account.
      enum:
        - active
        - suspended
        - needs_reconnect

    AccessibleAccount:
      type: object
      description: >
        A Google Ads account accessible to the authenticated OAuth identity,
        as returned by the callback for user selection.
      required:
        - customer_id
        - account_name
        - currency_code
        - timezone
        - already_connected
      properties:
        customer_id:
          type: string
          description: Google Ads Customer ID, formatted `XXX-XXX-XXXX`.
          example: '123-456-7890'
        account_name:
          type: string
          example: Minha Loja
        currency_code:
          type: string
          description: ISO 4217 currency code.
          example: BRL
        timezone:
          type: string
          description: IANA timezone identifier.
          example: America/Sao_Paulo
        already_connected:
          type: boolean
          description: True if this account is already connected and cannot be selected again.

    ConnectedAccount:
      type: object
      description: A Google Ads account persisted by ads-manager.
      required:
        - id
        - customer_id
        - account_name
        - currency_code
        - timezone
        - status
        - connected_at
      properties:
        id:
          type: string
          format: uuid
          description: Internal id of the connected account.
        customer_id:
          type: string
          description: Google Ads Customer ID, formatted `XXX-XXX-XXXX`.
          example: '123-456-7890'
        account_name:
          type: string
          example: Minha Loja
        currency_code:
          type: string
          description: ISO 4217 currency code.
          example: BRL
        timezone:
          type: string
          description: IANA timezone identifier.
          example: America/Sao_Paulo
        status:
          $ref: '#/components/schemas/AccountStatus'
        connected_at:
          type: string
          format: date-time
          description: ISO8601 timestamp of when the account was connected.

    StartOAuthResponse:
      type: object
      required:
        - authorization_url
      properties:
        authorization_url:
          type: string
          format: uri
          description: Google OAuth consent screen URL to redirect the user to.
          example: https://accounts.google.com/o/oauth2/v2/auth?...

    OAuthCallbackResponse:
      type: object
      required:
        - accessible_accounts
      properties:
        accessible_accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccessibleAccount'

    ConnectAccountsRequest:
      type: object
      required:
        - customer_ids
      properties:
        customer_ids:
          type: array
          description: Google Ads Customer IDs selected by the user to connect.
          items:
            type: string
            example: '123-456-7890'
          minItems: 1

    ConnectAccountsResponse:
      type: object
      required:
        - connected
      properties:
        connected:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedAccount'

    ListAccountsResponse:
      type: object
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedAccount'

    CampaignDateRange:
      type: string
      description: >
        Date range preset for campaign metrics. `custom` requires `start` and
        `end` query parameters.
      enum:
        - 7d
        - 30d
        - 90d
        - custom

    CampaignStatus:
      type: string
      description: Campaign status as reported by the Google Ads API.
      enum:
        - ENABLED
        - PAUSED
        - REMOVED

    Campaign:
      type: object
      description: >
        A campaign's performance metrics for the requested date range.
        Derived metrics (ctr, avg_cpc, conversion_rate, cost_per_conversion,
        roas) are computed from raw values (impressions, clicks, cost,
        conversions, conversion value), not stored directly.
      required:
        - campaign_id
        - name
        - status
        - impressions
        - clicks
        - ctr
        - avg_cpc
        - cost
        - conversions
        - conversion_rate
        - cost_per_conversion
        - roas
        - budget
      properties:
        campaign_id:
          type: string
          description: Google Ads Campaign ID.
          example: '111222333'
        name:
          type: string
          example: Campanha Institucional
        status:
          $ref: '#/components/schemas/CampaignStatus'
        impressions:
          type: integer
          example: 12345
        clicks:
          type: integer
          example: 234
        ctr:
          type: number
          description: Click-through rate (clicks / impressions). 0 when impressions is 0.
          example: 0.019
        avg_cpc:
          type: number
          description: Average cost per click (cost / clicks). 0 when clicks is 0.
          example: 1.25
        cost:
          type: number
          description: Total cost for the period, in account currency (converted from micros).
          example: 292.5
        conversions:
          type: number
          example: 8
        conversion_rate:
          type: number
          description: Conversions / clicks. 0 when clicks is 0.
          example: 0.034
        cost_per_conversion:
          type: number
          description: Cost / conversions. 0 when conversions is 0.
          example: 36.56
        roas:
          type: number
          description: Return on Ad Spend (conversion value / cost). 0 when cost is 0.
          example: 3.2
        budget:
          type: number
          nullable: true
          description: Daily budget in account currency (converted from micros), if available.
          example: 50.0

    ListCampaignsResponse:
      type: object
      required:
        - campaigns
        - fetched_at
        - stale
      properties:
        campaigns:
          type: array
          description: Campaigns ordered by cost, descending.
          items:
            $ref: '#/components/schemas/Campaign'
        fetched_at:
          type: string
          format: date-time
          description: >
            ISO8601 timestamp of the last successful fetch from the Google
            Ads API for this account + date range.
        stale:
          type: boolean
          description: >
            True when the Google Ads API fetch failed and this data comes
            from an expired cache entry.

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >
            Machine-readable error code. One of: INVALID_STATE, OAUTH_DENIED,
            ACCOUNT_NOT_FOUND, ALREADY_CONNECTED, GOOGLE_ADS_API_ERROR,
            INVALID_DATE_RANGE, ACCOUNT_NEEDS_RECONNECT.
          enum:
            - INVALID_STATE
            - OAUTH_DENIED
            - ACCOUNT_NOT_FOUND
            - ALREADY_CONNECTED
            - GOOGLE_ADS_API_ERROR
            - INVALID_DATE_RANGE
            - ACCOUNT_NEEDS_RECONNECT
        message:
          type: string
          description: Human-readable error message.
        details:
          type: object
          description: Additional error details.

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
