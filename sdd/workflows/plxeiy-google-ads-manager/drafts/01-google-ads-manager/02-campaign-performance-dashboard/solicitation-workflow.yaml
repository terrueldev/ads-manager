  context_goal:
    problem: "Herdado do epic: depois de conectar contas (google-ads-connection), ainda não há forma de ver como as campanhas estão performando."
    primary_user: "Herdado do epic: dono da conta, uso single-user."
    expected_outcome: "Dashboard que mostra, para uma conta conectada e um período selecionado, a lista de campanhas com métricas de performance, com cache para não estourar rate limit e indicador de dados desatualizados quando a API falha."
