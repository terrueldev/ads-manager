    - "Selecionar qual conta conectada visualizar (dropdown, uma por vez)"
    - "Selecionar período: presets 7/30/90 dias + customizado, padrão 30 dias"
    - "Buscar e exibir campanhas da conta+período: nome, status, impressões, cliques, CTR, CPC médio, custo, conversões, taxa de conversão, custo/conversão, ROAS, orçamento vs. gasto — ordenadas por gasto decrescente"
    - "Cache de 15 minutos por conta+período; botão 'Atualizar' força novo fetch"
    - "Se a API do Google Ads falhar e houver cache, mostrar cache com indicador 'desatualizado'; se não houver cache, mostrar erro claro"
    - "Se a conta estiver com status needs_reconnect, avisar e não tentar buscar dados"
