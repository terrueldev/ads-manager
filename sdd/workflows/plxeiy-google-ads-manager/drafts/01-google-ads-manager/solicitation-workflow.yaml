answers:
  context_goal:
    problem: "Gerenciar e otimizar campanhas do Google Ads hoje exige checar manualmente o painel do Google Ads e interpretar dados sem apoio de IA; não existe ferramenta unificada que conecte contas, mostre performance e sugira/aplique otimizações com IA."
    primary_user: "O próprio dono da conta (uso single-user / pequena equipe) gerenciando contas de Google Ads."
    expected_outcome: "App web para conectar uma ou mais contas do Google Ads, visualizar performance de campanhas, conversar com o Claude para obter análise e sugestões, e aplicar as mudanças aprovadas via MCP google-ads-mcp-rw."
  functional_requirements:
    - "Conectar conta(s) do Google Ads via OAuth (múltiplas contas)"
    - "Buscar e exibir métricas-chave de performance das campanhas após conectar"
    - "Interagir com o Claude, fornecendo dados de performance como contexto, para obter análise e sugestões"
    - "Aplicar melhorias sugeridas e aprovadas na conta via MCP google-ads-mcp-rw"
    - "Desconectar/remover uma conta conectada"
  non_functional_requirements:
    performance: "Dashboard carrega métricas em poucos segundos via cache local; resposta do Claude pode ser mais lenta (streaming aceitável)."
    security: "Tokens OAuth e credenciais do MCP criptografados no banco; chamadas à API do Google Ads e ao MCP apenas no servidor, nunca expostas ao frontend; sem senha/proteção de acesso à aplicação (decisão explícita, uso single-user local)."
    scalability: "Baixa prioridade — uso single-user, poucas dezenas de contas no máximo."
    reliability: "Se a API do Google Ads falhar/limitar taxa, mostrar último dado em cache com indicador de 'desatualizado'; mudanças via MCP só são marcadas 'aplicadas' após confirmação de sucesso."
  user_stories:
    - "Como dono da conta, quero conectar uma ou mais contas do Google Ads via OAuth, para gerenciar todas as campanhas em um só lugar."
    - "Como dono da conta, quero ver as métricas-chave das minhas campanhas, para avaliar rapidamente a performance."
    - "Como dono da conta, quero conversar com o Claude sobre os dados das campanhas, para obter análise e sugestões de melhoria."
    - "Como dono da conta, quero revisar e aprovar as mudanças sugeridas antes de aplicá-las, para manter controle sobre o orçamento."
    - "Como dono da conta, quero que mudanças aprovadas sejam aplicadas automaticamente via MCP, para não precisar replicá-las manualmente no painel do Google Ads."
    - "Como dono da conta, quero desconectar/remover uma conta conectada, para controlar a quais contas a ferramenta tem acesso."
  edge_cases:
    - "OAuth negado ou falho → erro claro, sem criar conta 'quebrada'"
    - "Token expirado / refresh falha → conta marcada 'precisa reconectar', banner no dashboard, sem quebrar outras contas"
    - "Rate limit da API do Google Ads → backoff + exibir cache com indicador de 'desatualizado'"
    - "Conta sem campanhas/dados no período → estado vazio, não erro"
    - "Pedir análise sem dados carregados → pedir para selecionar conta/campanha primeiro"
    - "MCP indisponível ao aplicar mudança → erro de conexão, sugestão continua pendente, permite retry"
    - "Conectar a mesma conta duas vezes → detectar e evitar duplicata"
    - "Sugestão ficou inválida entre aprovação e aplicação → validar antes de aplicar, mostrar conflito"
  dependencies:
    - "Google Ads API developer token + credenciais OAuth (projeto no Google Cloud)"
    - "Rate limits/quotas da Google Ads API (nível Basic/Standard do developer token)"
    - "MCP google-ads-mcp-rw (github.com/maxghenis/google-ads-mcp-rw) — precisa ser deployado/configurado; ações limitadas ao que o MCP expõe"
    - "Acesso à API da Anthropic (chave de API) para a funcionalidade de análise"
  tests:
    unit:
      - "Troca/refresh de token OAuth (sucesso, falha, negado)"
      - "Cálculo/agregação de métricas a partir da resposta da API do Google Ads"
      - "Máquina de estados da sugestão (pending → approved → applied/rejected)"
      - "Construção do payload MCP por tipo de sugestão"
    integration:
      - "Fluxo OAuth completo contra conta de teste/sandbox"
      - "Endpoint de métricas de campanha retorna formato esperado pelo dashboard"
      - "Endpoint de análise via Claude retorna sugestões estruturadas a partir de dados de exemplo"
      - "Aplicar sugestão via MCP (mock de sucesso e de falha) atualiza status corretamente"
      - "Desconectar conta remove tokens e para chamadas futuras"
    e2e:
      - "Conectar conta → ver dashboard → pedir análise → aprovar sugestão → ver aplicada (conta sandbox + MCP mockado)"
      - "Caminho de erro: MCP indisponível ao aplicar → usuário vê erro, sugestão permanece pendente"
  technical_details:
    database:
      details:
        - "Entidades: connected_accounts, campaigns (cache), suggestions, applied_changes_audit_log"
        - "Log de auditoria de mudanças aplicadas é mantido mesmo após desconexão da conta (retenção independente)"
        - "Tokens OAuth e credenciais MCP armazenados criptografados"
    server:
      details:
        - "Orquestra OAuth (connect/refresh/disconnect), cache/refresh de métricas de campanhas"
        - "Monta contexto de performance (campanha, grupo de anúncios, palavra-chave) para o Claude"
        - "Gerencia ciclo de vida das sugestões (pending/approved/rejected/applied/failed)"
        - "Chama o MCP google-ads-mcp-rw ao aprovar uma sugestão; só marca 'applied' após confirmação"
        - "Sem camada de autenticação da aplicação (decisão explícita)"
    contract:
      details:
        - "Endpoints: connect account (OAuth callback), list/disconnect accounts, get campaigns+métricas por conta/período, request Claude analysis, list/approve/reject suggestions"
        - "Único consumidor: o webapp"
        - "Erros: validação, não encontrado, conflito (conta duplicada / sugestão obsoleta), falha upstream (Google Ads/MCP/Claude indisponível)"
    webapp:
      details:
        - "Telas: Contas (conectar/listar/desconectar), Dashboard (campanhas + métricas + seletor de período), Chat/Análise com Claude, Lista de Sugestões (aprovar/rejeitar)"
        - "Estados de loading, vazio, erro, e banner de 'reconectar' quando token expira"

